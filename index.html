<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#003ab1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thông báo">
  <link rel="apple-touch-icon" sizes="512x512" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <title>Thông báo</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* ẢNH NỀN VẼ TRỰC TIẾP TRÊN <html> (canvas của trang).
       Canvas luôn được vẽ phủ toàn bộ màn hình, kể cả phần iOS không tính vào viewport.
       Chiều cao html (--app-h) do JS đặt = chiều cao thật của màn hình,
       nên đáy ảnh luôn sát đáy điện thoại. */
    html {
      height: var(--app-h, 100%);
      background: #003ab1 url("background.png") no-repeat 0 0 / 100% 100%;
    }

    body {
      position: fixed;
      inset: 0;
      overflow: visible;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    .app-screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: var(--app-h, 100%);
      overflow: hidden;
      background: transparent;
    }

    #dbgHot { position: fixed; left: 0; top: 0; width: 80px; height: 80px; z-index: 100; touch-action: manipulation; }
    #dbgBox { position: fixed; left: 6px; top: 90px; z-index: 99; margin: 0; padding: 6px; font: 11px/1.35 monospace;
      color: #0f0; background: rgba(0,0,0,.8); pointer-events: none; white-space: pre-wrap; display: none; }
    #dbgRed { position: fixed; left: 0; right: 0; bottom: 0; height: 4px; background: red; z-index: 98; display: none; pointer-events: none; }

    .toast-wrap {
      position: absolute;
      z-index: 2;
      opacity: 0;
      transform: scale(.975);
      transform-origin: center;
      will-change: left, top, width, height, opacity, transform;
      background: transparent;
      transition: opacity .18s ease-out, transform .18s ease-out;
      pointer-events: none;
    }

    .toast-visible .toast-wrap {
      opacity: 0.95; /* Mờ đi khoảng 5% theo yêu cầu */
      transform: scale(1);
      transition: opacity .28s ease, transform .34s cubic-bezier(.2, .75, .3, 1);
    }

    .toast-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .understood {
      position: absolute;
      left: 4.8%;
      top: 83.7%;
      width: 90.4%;
      height: 9.4%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .understood:disabled {
      pointer-events: none;
    }

    .understood:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .95);
      outline-offset: -5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .toast-wrap {
        transition-duration: .01ms;
      }
    }
  </style>
</head>
<body>
  <div id="dbgHot"></div><div id="dbgRed"></div><pre id="dbgBox"></pre>
  <main class="app-screen" id="appScreen" aria-label="Thông báo toàn màn hình">
    <section class="toast-wrap" id="toastWrap" aria-label="Nội dung thông báo" aria-hidden="true">
      <img class="toast-art" src="toast.png" alt="Thẻ thông báo màu xanh đậm">
      <button class="understood" id="understood" type="button" aria-label="Đã hiểu" disabled>Đã hiểu</button>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var BACKGROUND_WIDTH = 1290;
      var BACKGROUND_HEIGHT = 2796;
      var WHITE_LEFT = 218;
      var WHITE_TOP = 852;
      var WHITE_WIDTH = 847;
      var WHITE_HEIGHT = 1092;

      var appScreen = document.getElementById("appScreen");
      var toastWrap = document.getElementById("toastWrap");
      var understood = document.getElementById("understood");

      var isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      var debugOn = /[?&]debug/.test(location.search);

      function placeToast() {
        var viewportWidth = window.innerWidth;
        var inner = window.innerHeight;
        var vv = window.visualViewport ? Math.round(window.visualViewport.height) : 0;
        var portrait = window.screen.height >= window.screen.width;
        var screenH = portrait ? window.screen.height : window.screen.width;

        // Chiều cao thật: chạy từ icon thì khung hiển thị = cả màn hình,
        // còn innerHeight trên iOS có thể ngắn hơn (thiếu vùng home indicator).
        var viewportHeight = Math.max(inner, vv);
        if (isStandalone) viewportHeight = Math.max(viewportHeight, screenH);

        document.documentElement.style.setProperty("--app-h", viewportHeight + "px");

        var scaleX = viewportWidth / BACKGROUND_WIDTH;
        var scaleY = viewportHeight / BACKGROUND_HEIGHT;

        toastWrap.style.left = (WHITE_LEFT * scaleX) + "px";
        toastWrap.style.top = (WHITE_TOP * scaleY) + "px";
        toastWrap.style.width = (WHITE_WIDTH * scaleX) + "px";
        toastWrap.style.height = (WHITE_HEIGHT * scaleY) + "px";

        var box = document.getElementById("dbgBox");
        var red = document.getElementById("dbgRed");
        if (debugOn) {
          box.style.display = red.style.display = "block";
          box.textContent =
            "standalone: " + isStandalone +
            "\ninner: " + window.innerWidth + " x " + inner +
            "\nvisualViewport H: " + vv +
            "\nscreen: " + window.screen.width + " x " + window.screen.height +
            "\nUSED H: " + viewportHeight +
            "\nhtml H: " + Math.round(document.documentElement.getBoundingClientRect().height) +
            "\nred line = đáy viewport";
        } else {
          box.style.display = red.style.display = "none";
        }
      }

      (function () {
        var taps = 0, timer = null;
        document.getElementById("dbgHot").addEventListener("click", function () {
          taps++;
          clearTimeout(timer);
          timer = setTimeout(function () { taps = 0; }, 700);
          if (taps >= 3) { taps = 0; debugOn = !debugOn; placeToast(); }
        });
      }());

      placeToast();
      window.setTimeout(placeToast, 300);
      window.setTimeout(placeToast, 1000);
      window.addEventListener("resize", placeToast, { passive: true });
      window.addEventListener("orientationchange", placeToast, { passive: true });
      window.addEventListener("load", placeToast, { passive: true });
      window.addEventListener("pageshow", placeToast, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", placeToast, { passive: true });
      }

      function showToast() {
        placeToast();
        appScreen.classList.add("toast-visible");
        toastWrap.setAttribute("aria-hidden", "false");
        understood.disabled = false;
      }

      window.setTimeout(showToast, 1000);

      understood.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        understood.disabled = true;
        appScreen.classList.remove("toast-visible");
        toastWrap.setAttribute("aria-hidden", "true");
        window.setTimeout(showToast, 1000);
      });

      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("selectstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("dragstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("touchmove", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturechange", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gestureend", function (event) {
        event.preventDefault();
      }, { passive: false });

      var lastTouchEnd = 0;
      document.addEventListener("touchend", function (event) {
        var now = Date.now();
        if (now - lastTouchEnd < 300 && event.target !== understood && event.target.id !== "dbgHot") {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }());
  </script>
</body>
</html>
