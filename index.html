  <title>Thông báo</title>
  <style>
    :root {
      color-scheme: light dark;
      --veil: rgba(0, 0, 0, .12);
      --fallback-bg: #000000;
      --fallback-ink: #8e8e93;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --veil: rgba(0, 0, 0, .16);
        --fallback-bg: #000000;
        --fallback-ink: #98989d;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: #8c8c8c;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    .app-screen {
      position: absolute;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      background: #8c8c8c;
    }

    .background {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--veil);
      opacity: 0;
      transition: opacity .42s ease;
      pointer-events: none;
    }

    .app-screen.toast-visible .veil {
      opacity: 1;
    }

    .toast-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 max(16px, env(safe-area-inset-right, 0px)) max(48px, calc(env(safe-area-inset-bottom, 0px) + 7dvh)) max(16px, env(safe-area-inset-left, 0px));
      pointer-events: none;
    }

    .toast-wrap {
      position: relative;
      width: min(82vw, 400px, calc((86dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 1039 / 1338));
      max-height: calc(86dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      aspect-ratio: 1039 / 1338;
      transform: translate3d(0, calc(100% + 32px), 0);
      opacity: 0;
      will-change: transform, opacity;
      transition: transform .62s cubic-bezier(.19, .78, .22, 1), opacity .24s ease;
      pointer-events: none;
    }

    .toast-visible .toast-wrap {
      transform: translate3d(0, 0, 0);
      opacity: 1;
    }

    .toast-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .understood {
      position: absolute;
      left: 5%;
      top: 81%;
      width: 89.5%;
      height: 12%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .understood:disabled {
      pointer-events: none;
    }

    .understood:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .95);
      outline-offset: -5px;
    }

    .exit-screen {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(30px, env(safe-area-inset-top, 0px)) 30px max(30px, env(safe-area-inset-bottom, 0px));
      background: var(--fallback-bg);
      color: var(--fallback-ink);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity .18s ease, visibility 0s linear .18s;
      pointer-events: none;
    }

    .exit-screen p {
      max-width: 260px;
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 450;
    }

    body.exited .exit-screen {
      opacity: 1;
      visibility: visible;
      transition: opacity .18s ease;
    }

    body.exited .app-screen {
      visibility: hidden;
    }

    @media (orientation: landscape) {
      .toast-stage {
        align-items: center;
      }

      .toast-wrap {
        width: auto;
        height: min(90dvh, 620px);
        max-height: calc(100dvh - 30px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast-wrap,
      .veil,
      .exit-screen {
        transition-duration: .01ms;
      }
    }
  </style>
</head>

  <section class="exit-screen" id="exitScreen" aria-live="polite">
    <p>Vuốt lên từ cạnh dưới để trở về Màn hình chính.</p>
  </section>

  <script>
    (function () {
      "use strict";

      var appScreen = document.getElementById("appScreen");
      var understood = document.getElementById("understood");

      window.setTimeout(function () {
        appScreen.classList.add("toast-visible");
        understood.disabled = false;
      }, 1000);

      understood.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        understood.disabled = true;

        try {
          window.close();
        } catch (error) {
          // The in-page fallback below is used when iOS blocks programmatic closing.
        }

        window.setTimeout(function () {
          document.body.classList.add("exited");
        }, 120);
      });

      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("selectstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("dragstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("touchmove", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturechange", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gestureend", function (event) {
        event.preventDefault();
      }, { passive: false });

      var lastTouchEnd = 0;
      document.addEventListener("touchend", function (event) {
        var now = Date.now();
        if (now - lastTouchEnd < 300 && event.target !== understood) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }());
  </script>
