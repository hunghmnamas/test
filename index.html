<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#003ab1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thông báo">
  <link rel="apple-touch-icon" sizes="512x512" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <title>Thông báo</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: #003ab1;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    /* Khung app luôn cao bằng CHIỀU CAO THẬT của màn hình (kể cả khi thanh
       công cụ Safari đang hiện), để ảnh nền chạm sát cạnh dưới điện thoại
       trong mọi trạng thái. 100lvh = large viewport height, ổn định và
       không bị co lại khi thanh công cụ hiện/ẩn. */
    .app-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;  /* dự phòng cho trình duyệt cũ */
      height: 100lvh;
      overflow: hidden;
      background: #003ab1;
    }

    /* Hiển thị ĐÚNG 100% ảnh background, không cắt, không lộ nền sau:
       - inset:0 + width/height:100% => khung ảnh = đúng .app-screen (100lvh).
       - object-fit: fill => ảnh phủ kín khung, toàn bộ ảnh luôn hiện. */
    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .toast-wrap {
      position: absolute;
      z-index: 2;
      /* Vị trí tính theo % của ảnh nền 1290x2796 nên LUÔN khớp với ảnh nền,
         vì cả hai cùng nằm trong .app-screen (100lvh) — không còn phụ thuộc
         vào chiều cao mà JS đo được khi thanh công cụ hiện/ẩn. */
      left: 16.8992%;
      top: 30.4721%;
      width: 65.6589%;
      height: 39.0558%;
      opacity: 0;
      transform: scale(.975);
      transform-origin: center;
      will-change: opacity, transform;
      background: transparent;
      transition: opacity .18s ease-out, transform .18s ease-out;
      pointer-events: none;
    }

    .toast-visible .toast-wrap {
      opacity: 0.95; /* Mờ đi khoảng 5% theo yêu cầu */
      transform: scale(1);
      transition: opacity .28s ease, transform .34s cubic-bezier(.2, .75, .3, 1);
    }

    .toast-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .understood {
      position: absolute;
      left: 4.8%;
      top: 83.7%;
      width: 90.4%;
      height: 9.4%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .understood:disabled {
      pointer-events: none;
    }

    .understood:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .95);
      outline-offset: -5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .toast-wrap {
        transition-duration: .01ms;
      }
    }
  </style>
</head>
<body>
  <main class="app-screen" id="appScreen" aria-label="Thông báo toàn màn hình">
    <img class="background" src="background.png" alt="Nền ứng dụng màu xanh">
    <section class="toast-wrap" id="toastWrap" aria-label="Nội dung thông báo" aria-hidden="true">
      <img class="toast-art" src="toast.png" alt="Thẻ thông báo màu xanh đậm">
      <button class="understood" id="understood" type="button" aria-label="Đã hiểu" disabled>Đã hiểu</button>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var appScreen = document.getElementById("appScreen");
      var toastWrap = document.getElementById("toastWrap");
      var understood = document.getElementById("understood");

      /* Vị trí toast đã được đặt bằng % trong CSS (.toast-wrap) nên luôn
         khớp với ảnh nền mà không cần đo viewport bằng JS. */

      function showToast() {
        appScreen.classList.add("toast-visible");
        toastWrap.setAttribute("aria-hidden", "false");
        understood.disabled = false;
      }

      window.setTimeout(showToast, 1000);

      understood.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        understood.disabled = true;
        appScreen.classList.remove("toast-visible");
        toastWrap.setAttribute("aria-hidden", "true");
        window.setTimeout(showToast, 1000);
      });

      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("selectstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("dragstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("touchmove", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturechange", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gestureend", function (event) {
        event.preventDefault();
      }, { passive: false });

      var lastTouchEnd = 0;
      document.addEventListener("touchend", function (event) {
        var now = Date.now();
        if (now - lastTouchEnd < 300 && event.target !== understood) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }());
  </script>
</body>
</html>
