<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#8c8c8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thông báo">
  <link rel="apple-touch-icon" sizes="512x512" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <title>Thông báo</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: #8c8c8c;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    .app-screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #8c8c8c;
    }

 .background {
      position: absolute;
      left: 50%;
      bottom: 0;                /* Neo chặt cạnh dưới xuống đáy màn hình */
      transform: translateX(-50%);
      width: 100%;             /* Ép chiều rộng phủ kín màn hình theo chiều ngang */
      height: 100vh;           /* Hoặc dùng 100dvh để khớp chuẩn di động */
      height: 100dvh;
      object-fit: cover;       /* Đảm bảo ảnh phủ kín mà không bị méo */
      object-position: center bottom; /* Quan trọng: Neo trọng tâm ảnh về phía cạnh dưới */
      pointer-events: none;
    }

   .toast-wrap {
      position: absolute;
      z-index: 2;
      opacity: 0;
      transform: scale(.85); /* Thu nhỏ trạng thái ban đầu */
      transform-origin: center;
      will-change: left, top, width, height, opacity, transform;
      background: transparent; /* Giữ trong suốt để không bị viền đỏ */
      transition: opacity .18s ease-out, transform .18s ease-out;
      pointer-events: none;
    }

    .toast-visible .toast-wrap {
      opacity: 0.85; /* Mờ đi khoảng 3% (giảm từ 1 xuống 0.97) */
      transform: scale(.90); /* Thu nhỏ kích thước hiển thị */
      transition: opacity .28s ease, transform .34s cubic-bezier(.2, .75, .3, 1);
    }

    .toast-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .understood {
      position: absolute;
      left: 4.8%;
      top: 83.7%;
      width: 90.4%;
      height: 9.4%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .understood:disabled {
      pointer-events: none;
    }

    .understood:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .95);
      outline-offset: -5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .toast-wrap {
        transition-duration: .01ms;
      }
    }
  </style>
</head>
<body>
  <main class="app-screen" id="appScreen" aria-label="Thông báo toàn màn hình">
    <img class="background" src="background.png" alt="Nền ứng dụng với vùng trắng ở giữa">
    <section class="toast-wrap" id="toastWrap" aria-label="Nội dung thông báo" aria-hidden="true">
      <img class="toast-art" src="toast.png" alt="Thông báo với nút Đã hiểu">
      <button class="understood" id="understood" type="button" aria-label="Đã hiểu" disabled>Đã hiểu</button>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var BACKGROUND_WIDTH = 1290;
      var BACKGROUND_HEIGHT = 2796;
      var WHITE_LEFT = 218;
      var WHITE_TOP = 852;
      var WHITE_WIDTH = 847;
      var WHITE_HEIGHT = 1092;

      var appScreen = document.getElementById("appScreen");
      var toastWrap = document.getElementById("toastWrap");
      var understood = document.getElementById("understood");

      function placeToast() {
        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;

        // Dùng scale max để ảnh cover đầy màn hình, sau đó cộng thêm một chút hệ số (ví dụ tăng 5% chiều cao) 
        // để chắc chắn mép dưới bị đẩy tràn xuống dưới cùng, không bao giờ lộ khoảng xám.
        var scale = Math.max(viewportWidth / BACKGROUND_WIDTH, viewportHeight / BACKGROUND_HEIGHT);
        
        var displayedWidth = BACKGROUND_WIDTH * scale;
        var displayedHeight = BACKGROUND_HEIGHT * scale;

        // Ép chiều cao ảnh cộng thêm một chút (ví dụ nhân 1.05 hoặc cộng 20px) để tràn đáy tuyệt đối
        var forcedHeight = displayedHeight + 25; 

        var offsetX = (viewportWidth - displayedWidth) / 2;
        var offsetY = (viewportHeight - forcedHeight) / 2;

        // Áp dụng kích thước trực tiếp cho thẻ background.png
        bgImg.style.width = displayedWidth + "px";
        bgImg.style.height = forcedHeight + "px";
        bgImg.style.left = offsetX + "px";
        bgImg.style.top = offsetY + "px";

        // === CĂN CHỈNH LẠI TOAST CHO KHỚP VỚI ẢNH BỊ KÉO TRÀN ===
        var customFactor = 0.5; // Hệ số thu nhỏ toast bạn đang dùng
        var targetWidth = WHITE_WIDTH * scale * customFactor;
        var targetHeight = WHITE_HEIGHT * scale * customFactor;

        var targetLeft = (offsetX + WHITE_LEFT * scale) + (WHITE_WIDTH * scale - targetWidth) / 2;
        var targetTop = (offsetY + WHITE_TOP * scale) + (WHITE_HEIGHT * scale - targetHeight) / 2;

        toastWrap.style.left = targetLeft + "px";
        toastWrap.style.top = targetTop + "px";
        toastWrap.style.width = targetWidth + "px";
        toastWrap.style.height = targetHeight + "px";
      }
      placeToast();
      window.addEventListener("resize", placeToast, { passive: true });
      window.addEventListener("orientationchange", placeToast, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", placeToast, { passive: true });
      }

      function showToast() {
        placeToast();
        appScreen.classList.add("toast-visible");
        toastWrap.setAttribute("aria-hidden", "false");
        understood.disabled = false;
      }

      window.setTimeout(showToast, 1000);

      understood.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        understood.disabled = true;
        appScreen.classList.remove("toast-visible");
        toastWrap.setAttribute("aria-hidden", "true");
        window.setTimeout(showToast, 1000);
      });

      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("selectstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("dragstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("touchmove", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturechange", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gestureend", function (event) {
        event.preventDefault();
      }, { passive: false });

      var lastTouchEnd = 0;
      document.addEventListener("touchend", function (event) {
        var now = Date.now();
        if (now - lastTouchEnd < 300 && event.target !== understood) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }());
  </script>
</body>
</html>
