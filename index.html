  <title>Thông báo</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: #8c8c8c;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    .app-screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #8c8c8c;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }

    .toast-wrap {
      position: absolute;
      z-index: 2;
      opacity: 0;
      transform: scale(.975);
      transform-origin: center;
      will-change: left, top, width, height, opacity, transform;
      background: rgb(211, 2, 52);
      transition: opacity .18s ease-out, transform .18s ease-out;
      pointer-events: none;
    }

    .toast-visible .toast-wrap {
      opacity: 1;
      transform: scale(1);
      transition: opacity .28s ease, transform .34s cubic-bezier(.2, .75, .3, 1);
    }

    .toast-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }

    .understood {
      position: absolute;
      left: 4.8%;
      top: 83.7%;
      width: 90.4%;
      height: 9.4%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .understood:disabled {
      pointer-events: none;
    }

    .understood:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .95);
      outline-offset: -5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .toast-wrap {
        transition-duration: .01ms;
      }
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      var BACKGROUND_WIDTH = 1290;
      var BACKGROUND_HEIGHT = 2796;
      var WHITE_LEFT = 218;
      var WHITE_TOP = 852;
      var WHITE_WIDTH = 847;
      var WHITE_HEIGHT = 1092;

      var appScreen = document.getElementById("appScreen");
      var toastWrap = document.getElementById("toastWrap");
      var understood = document.getElementById("understood");

      function placeToast() {
        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;
        var scale = Math.max(viewportWidth / BACKGROUND_WIDTH, viewportHeight / BACKGROUND_HEIGHT);
        var displayedWidth = BACKGROUND_WIDTH * scale;
        var displayedHeight = BACKGROUND_HEIGHT * scale;
        var offsetX = (viewportWidth - displayedWidth) / 2;
        var offsetY = (viewportHeight - displayedHeight) / 2;

        toastWrap.style.left = (offsetX + WHITE_LEFT * scale) + "px";
        toastWrap.style.top = (offsetY + WHITE_TOP * scale) + "px";
        toastWrap.style.width = (WHITE_WIDTH * scale) + "px";
        toastWrap.style.height = (WHITE_HEIGHT * scale) + "px";
      }

      placeToast();
      window.addEventListener("resize", placeToast, { passive: true });
      window.addEventListener("orientationchange", placeToast, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", placeToast, { passive: true });
      }

      function showToast() {
        placeToast();
        appScreen.classList.add("toast-visible");
        toastWrap.setAttribute("aria-hidden", "false");
        understood.disabled = false;
      }

      window.setTimeout(showToast, 1000);

      understood.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        understood.disabled = true;
        appScreen.classList.remove("toast-visible");
        toastWrap.setAttribute("aria-hidden", "true");
        window.setTimeout(showToast, 1000);
      });

      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("selectstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("dragstart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("touchmove", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gesturechange", function (event) {
        event.preventDefault();
      }, { passive: false });

      document.addEventListener("gestureend", function (event) {
        event.preventDefault();
      }, { passive: false });

      var lastTouchEnd = 0;
      document.addEventListener("touchend", function (event) {
        var now = Date.now();
        if (now - lastTouchEnd < 300 && event.target !== understood) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }());
  </script>
</body>
</html>
